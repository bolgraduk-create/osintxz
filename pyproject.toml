[build-system]
requires = [
    "setuptools>=80.0",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "intelligence-platform"
version = "0.1.0"
description = "Professional OSINT Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Mark" }
]

license = { text = "Proprietary" }

dependencies = [

    # ------------------------
    # API
    # ------------------------

    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",

    # ------------------------
    # Database
    # ------------------------

    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "psycopg[binary]>=3.2.10",

    # ------------------------
    # Config
    # ------------------------

    "pydantic>=2.11.7",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",

    # ------------------------
    # Security
    # ------------------------

    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",

    # ------------------------
    # AI
    # ------------------------

    "ollama>=0.5.3",

    # ------------------------
    # Dashboard
    # ------------------------

    "streamlit>=1.49.0",
    "plotly>=6.3.0",
    "networkx>=3.5",
    "pyvis>=0.3.2",

    # ------------------------
    # Desktop Interface
    # ------------------------

    "PySide6>=6.8.0",

    # ------------------------
    # Utilities
    # ------------------------

    "httpx>=0.28.1",
    "socksio>=1.0.0,<2.0.0",
    "requests>=2.32.5",
    "rich>=14.1.0",

    # ------------------------
    # Queue
    # ------------------------

    "celery>=5.5.3",
    "redis>=6.4.0",

    # ------------------------
    # Vector DB
    # ------------------------

    "pgvector>=0.4.1",
]


[project.optional-dependencies]

dev = [

    "black>=25.1.0",

    "ruff>=0.12.12",

    "mypy>=1.17.1",

    "pytest>=8.4.2",

    "pytest-cov>=7.0.0",
]


media = [

    # ------------------------
    # Core image processing
    # ------------------------

    "pillow",

    "opencv-python",

    "moviepy",

    # ------------------------
    # Image hashes
    # ------------------------

    "ImageHash",

    # ------------------------
    # Image embeddings
    # ------------------------

    "fastembed==0.8.0",

    "onnxruntime==1.29.0",

    # ------------------------
    # OCR
    # ------------------------

    "rapidocr==3.9.2",

    # ------------------------
    # Audio / Video transcription
    # ------------------------

    "faster-whisper==1.2.1",

    "ctranslate2==4.8.1",

    "av==18.1.0",
]


osint = [

    "dnspython",

    "python-whois",
]


[tool.setuptools]

include-package-data = true


[tool.setuptools.packages.find]

where = ["."]

include = [

    "app",

    "app.*",
]

exclude = [

    "tests*",

    "docs*",

    "storage*",

    "cache*",

    "exports*",

    "migrations*",

    "scripts*",
]


[tool.black]

line-length = 88

target-version = ["py312"]


[tool.ruff]

line-length = 88

target-version = "py312"


[tool.ruff.lint]

select = [

    "E",

    "F",

    "W",

    "I",

    "UP",

    "B",
]


[tool.mypy]

python_version = "3.12"

disallow_untyped_defs = true

ignore_missing_imports = true

warn_return_any = true

warn_unused_configs = true


[tool.pytest.ini_options]

pythonpath = ["."]

testpaths = [

    "tests",
]