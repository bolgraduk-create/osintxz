[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# The real database URL is loaded from app.core.config.settings in
# migrations/env.py. Never store credentials in this file.
sqlalchemy.url = postgresql+psycopg://unused:unused@localhost/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
